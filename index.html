<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101318">
  <title>File Explorer</title>
  <style>
    :root{color-scheme:dark;--bg:#101318;--panel:#171b22;--panel2:#1c212a;--line:#2a303a;--text:#e8ebf0;--muted:#929baa;--accent:#82aaff;--accent-soft:#253654;--gold:#e8bb72;--green:#91c7a3;--red:#e99595}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Inter,system-ui,sans-serif;min-height:100vh}
    .app{max-width:1500px;margin:auto;padding:27px 32px 36px}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.brand-icon{width:38px;height:38px;border:1px solid #384456;background:#1a2433;border-radius:11px;display:grid;place-items:center;color:var(--accent)}.brand-icon svg{width:21px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.brand h1{font-size:20px;margin:1px 0 0;font-weight:620;letter-spacing:-.02em}.root-badge{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#aab4c2;font-size:12px}.root-badge i{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin:0 7px 1px 0}
    .toolbar{display:flex;align-items:center;gap:9px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 0 0}.nav-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);display:grid;place-items:center;cursor:pointer}.nav-btn:hover:not(:disabled){border-color:#53647e;background:#222a35}.nav-btn:disabled{opacity:.35;cursor:default}.nav-btn svg{width:16px;height:16px}.address{height:36px;display:flex;align-items:center;gap:9px;flex:1;padding:0 12px;background:#11151b;border:1px solid #2b313b;border-radius:8px;color:#bdc5d0;min-width:100px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:12px/1.3 Consolas,"Cascadia Code",monospace}.address svg{flex:0 0 auto;width:15px;color:var(--accent)}.count{min-width:100px;text-align:right;color:var(--muted);font-size:12px;padding-right:5px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;overflow:hidden;min-height:570px}.main{min-width:0;background:#13171d}.list-head{height:42px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(200px,1fr) 100px 166px;padding:0 18px;align-items:center;color:#858e9b;font-size:11px;letter-spacing:.04em;text-transform:uppercase}.items{padding:5px 8px}.row{height:44px;display:grid;grid-template-columns:minmax(200px,1fr) 100px 166px;align-items:center;padding:0 10px;border:1px solid transparent;border-radius:7px;cursor:default;color:#d5dae2;transition:background .12s,border-color .12s}.row:hover{background:#1a2028}.row.selected{background:#202c3d;border-color:#304361}.name-cell{display:flex;align-items:center;gap:11px;min-width:0}.item-icon{width:21px;height:21px;flex:0 0 auto;display:grid;place-items:center;color:#aebad0}.item-icon.folder{color:var(--gold)}.item-icon svg{width:19px;height:19px}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{font-size:9px;letter-spacing:.06em;color:#b8c3d0;border:1px solid #3a434f;border-radius:4px;padding:1px 4px;margin-left:7px;vertical-align:1px}.size,.date{font-size:12px;color:#929baa}.size{font-variant-numeric:tabular-nums}.date{font-variant-numeric:tabular-nums}.empty,.loading,.error{padding:50px 22px;text-align:center;color:var(--muted)}.error{color:var(--red)}
    .props{background:var(--panel);border-left:1px solid var(--line);padding:20px 18px}.props-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.props-title{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:#afb7c2}.props-pin{width:26px;height:26px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;color:#778394}.props-pin svg{width:13px}.empty-props{height:calc(100% - 46px);min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#818b9a}.empty-props-icon{width:49px;height:49px;display:grid;place-items:center;border:1px solid #333b47;border-radius:14px;color:#8393aa;margin-bottom:14px;background:#1b2028}.empty-props-icon svg{width:23px}.empty-props strong{font-weight:550;color:#b7bfca;margin-bottom:5px}.empty-props span{font-size:12px;max-width:180px}.prop-hero{padding:16px 12px 19px;text-align:center;border:1px solid var(--line);background:#1b2028;border-radius:10px;margin-bottom:18px}.prop-hero .item-icon{width:40px;height:40px;margin:0 auto 10px}.prop-hero .item-icon svg{width:32px;height:32px}.prop-name{font-size:13px;font-weight:560;overflow-wrap:anywhere}.prop-kind{font-size:11px;color:var(--muted);margin-top:4px}.prop-group{margin-top:16px}.prop-group h3{font-size:10px;color:#7f8998;text-transform:uppercase;letter-spacing:.09em;font-weight:600;margin:0 0 8px}.prop-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #252b34;font-size:11px}.prop-line:last-child{border-bottom:0}.prop-line .key{color:#8791a0;flex:0 0 66px}.prop-line .value{color:#d0d5dd;text-align:right;overflow-wrap:anywhere}.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.flag{font-size:10px;padding:3px 7px;border:1px solid #3a424d;border-radius:999px;color:#bbc3ce}.flag.yes{border-color:#3c5947;color:#9ecba9;background:#18231c}.status{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:11px 4px 0;margin-top:11px;color:#7e8998;font-size:11px}.status-left{display:flex;gap:8px;align-items:center}.hint{color:#737e8c}.spinner{width:14px;height:14px;border:2px solid #3b4553;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:850px){.app{padding:19px 15px}.layout{grid-template-columns:minmax(0,1fr) 250px}.list-head,.row{grid-template-columns:minmax(130px,1fr) 75px 125px;padding-left:13px;padding-right:13px}.props{padding:17px 14px}.count{min-width:65px}}@media(max-width:650px){.app{padding:14px 10px}.root-badge{display:none}.layout{grid-template-columns:1fr}.props{border-left:0;border-top:1px solid var(--line);min-height:250px}.empty-props{min-height:200px}.list-head,.row{grid-template-columns:minmax(110px,1fr) 74px}.list-head span:last-child,.date{display:none}.toolbar{gap:6px;padding:8px}.nav-btn{width:31px;height:31px}.count{min-width:55px;font-size:11px}.brand h1{font-size:18px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topline"><div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 10h17"/></svg></div><div><div class="eyebrow">Local workspace</div><h1>File Explorer</h1></div></div><div class="root-badge"><i></i>System drive</div></header>
    <div class="toolbar"><button id="back" class="nav-btn" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m14.5 5-7 7 7 7"/></svg></button><button id="up" class="nav-btn" title="Up one level" aria-label="Up one level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 14.5 7-7 7 7"/></svg></button><div id="address" class="address" aria-label="Current folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 10h17"/></svg><span></span></div><button id="refresh" class="nav-btn" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4.5 17a8 8 0 0 0 13.7 1.1L20 15M4 17v-5h5m10.5-5A8 8 0 0 0 5.8 5.9L4 9"/></svg></button><div id="count" class="count"></div></div>
    <div class="layout"><main class="main"><div class="list-head"><span>Name</span><span>Size</span><span>Date modified</span></div><div id="items" class="items"><div class="loading"><span class="spinner"></span><br><br>Opening system root…</div></div></main><aside class="props"><div class="props-head"><div class="props-title">Properties</div><div class="props-pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m8 4 8 8m-10-5 6-6 6 6-6 6m-1-1-6 6m3-3 4 4"/></svg></div></div><div id="properties" class="empty-props"><div class="empty-props-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4M11 8v3m0 3h.01"/></svg></div><strong>Nothing selected</strong><span>Select an item to see its properties</span></div></aside></div>
    <footer class="status"><div id="status" class="status-left"><span>Showing hidden and system items</span></div><div class="hint">Double-click a folder to open</div></footer>
  </div>
<script>
const $=s=>document.querySelector(s), itemsEl=$('#items'), propsEl=$('#properties');
let currentPath='', parentPath=null, selected=null, history=[], busy=false;
const folderSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 10h17"/></svg>';
const fileSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55"><path d="M6 3.5h8l4.5 4.5v12a.5.5 0 0 1-.5.5h-12a.5.5 0 0 1-.5-.5z"/><path d="M14 3.5V8h4.5M9 13h6m-6 3h6"/></svg>';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function prettySize(n){if(n==null)return '—';if(n===0)return '0 B';const units=['B','KB','MB','GB','TB'];let i=0,x=n;while(x>=1024&&i<units.length-1){x/=1024;i++}return `${i?x.toFixed(x>=10?1:2):x} ${units[i]}`}
function prettyDate(s){if(!s)return '—';return new Intl.DateTimeFormat(undefined,{year:'numeric',month:'short',day:'2-digit'}).format(new Date(s))}
function icon(kind){return `<span class="item-icon ${kind}">${kind==='folder'?folderSvg:fileSvg}</span>`}
async function navigate(path,push=true){if(busy)return;busy=true;$('#status').innerHTML='<span class="spinner"></span><span>Loading folder…</span>';itemsEl.innerHTML='<div class="loading"><span class="spinner"></span><br><br>Loading folder…</div>';try{const res=await fetch('/api/list?path='+encodeURIComponent(path));const data=await res.json();if(!res.ok)throw Error(data.error||'Could not open folder');if(push&&currentPath&&currentPath!==data.path)history.push(currentPath);currentPath=data.path;parentPath=data.parent;selected=null;$('#address span').textContent=currentPath;$('#count').textContent=`${data.items.length} ${data.items.length===1?'item':'items'}`;$('#back').disabled=history.length===0;$('#up').disabled=!parentPath;$('#status').textContent='Showing hidden and system items';draw(data.items)}catch(e){itemsEl.innerHTML=`<div class="error">${esc(e.message)}</div>`;$('#count').textContent='';$('#status').textContent='Folder unavailable'}finally{busy=false}}
function draw(items){if(!items.length){itemsEl.innerHTML='<div class="empty">This folder is empty.</div>';return}itemsEl.innerHTML=items.map(x=>`<div class="row" tabindex="0" data-path="${esc(x.path)}" data-kind="${x.kind}"><div class="name-cell">${icon(x.kind)}<span class="name">${esc(x.name)}</span>${x.hidden?'<span class="tag">HIDDEN</span>':''}${x.system?'<span class="tag">SYSTEM</span>':''}</div><span class="size">${x.kind==='folder'?'—':prettySize(x.size)}</span><span class="date">${prettyDate(x.modified)}</span></div>`).join('');for(const row of itemsEl.querySelectorAll('.row')){row.addEventListener('click',()=>selectItem(row));row.addEventListener('dblclick',()=>{if(row.dataset.kind==='folder')navigate(row.dataset.path)});row.addEventListener('keydown',e=>{if(e.key==='Enter'&&row.dataset.kind==='folder')navigate(row.dataset.path)})}}
function selectItem(row){itemsEl.querySelector('.selected')?.classList.remove('selected');row.classList.add('selected');selected=row.dataset.path;loadProperties(selected)}
async function loadProperties(path){propsEl.innerHTML='<div class="empty-props"><span class="spinner"></span></div>';try{const res=await fetch('/api/properties?path='+encodeURIComponent(path));const d=await res.json();if(!res.ok)throw Error(d.error);const flags=[['Hidden',d.hidden],['System',d.system],['Read-only',d.readonly]];propsEl.innerHTML=`<div class="prop-hero">${icon(d.kind.toLowerCase())}<div class="prop-name">${esc(d.name||d.path)}</div><div class="prop-kind">${esc(d.type)}</div></div><div class="prop-group"><h3>General</h3><div class="prop-line"><span class="key">Kind</span><span class="value">${esc(d.kind)}</span></div><div class="prop-line"><span class="key">Size</span><span class="value">${d.size==null?'—':prettySize(d.size)}</span></div><div class="prop-line"><span class="key">Location</span><span class="value">${esc(d.path)}</span></div><div class="flags">${flags.map(([n,v])=>`<span class="flag ${v?'yes':''}">${n}${v?' · Yes':' · No'}</span>`).join('')}</div></div><div class="prop-group"><h3>Dates</h3><div class="prop-line"><span class="key">Modified</span><span class="value">${prettyDate(d.modified)}</span></div><div class="prop-line"><span class="key">Created</span><span class="value">${prettyDate(d.created)}</span></div><div class="prop-line"><span class="key">Accessed</span><span class="value">${prettyDate(d.accessed)}</span></div></div>`}catch(e){propsEl.innerHTML=`<div class="empty-props"><strong>Properties unavailable</strong><span>${esc(e.message)}</span></div>`}}
$('#back').addEventListener('click',()=>{const previous=history.pop();if(previous)navigate(previous,false)});$('#up').addEventListener('click',()=>{if(parentPath)navigate(parentPath)});$('#refresh').addEventListener('click',()=>navigate(currentPath,false));
navigate('C:\\');
</script>
</body>
</html>
